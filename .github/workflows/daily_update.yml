name: 每日資料更新

on:
  schedule:
    - cron: "0 11 * * 1-5"
  workflow_dispatch:
    inputs:
      module:
        description: "只跑指定模組（空=全部）"
        required: false
        default: ""
        type: choice
        options:
          - ""
          - chips
          - financials
          - futures
          - shareholder
          - prices
      force:
        description: "強制重抓（忽略快取）"
        required: false
        default: false
        type: boolean

jobs:
  update-data:
    name: 更新資料並推送CSV
    runs-on: ubuntu-latest
    timeout-minutes: 90

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas yfinance tqdm google-genai feedparser

      - name: Ensure data directories exist
        run: |
          mkdir -p data/prices

      - name: Run update_data.py
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: |
          ARGS="--no-push"
          if [ -n "${{ github.event.inputs.module }}" ]; then
            ARGS="$ARGS --only ${{ github.event.inputs.module }}"
            echo "只跑模組: ${{ github.event.inputs.module }}"
          else
            ARGS="$ARGS --skip financials"
            echo "全模組更新，跳過 financials"
          fi
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
            echo "強制重抓模式"
          fi
          echo "執行: python update_data.py $ARGS"
          python update_data.py $ARGS

      - name: Run generate_dynamic_themes.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -f "generate_dynamic_themes.py" ]; then
            echo "執行 AI 題材分析..."
            python generate_dynamic_themes.py || echo "Gemini 失敗，跳過"
          fi

      - name: Run generate_munger_sentiment.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -f "generate_munger_sentiment.py" ]; then
            echo "執行蒙格情緒分析..."
            python generate_munger_sentiment.py || echo "失敗，跳過"
          fi

      - name: Configure Git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and push changes
        run: |
          git add data/
          if git diff --staged --quiet; then
            echo "無變更，不 commit"
          else
            CHANGED=$(git diff --staged --name-only | wc -l)
            DATE=$(date +'%Y-%m-%d')
            git commit -m "chore: auto update ${DATE} (${CHANGED} files)"
            git push origin main --force-with-lease
            echo "已推送 ${CHANGED} 個檔案"
          fi

      - name: Summary
        if: always()
        run: |
          echo "## 更新完成" >> $GITHUB_STEP_SUMMARY
          echo "- 執行時間: $(date +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "- 台灣時間: $(TZ=Asia/Taipei date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_STEP_SUMMARY
          if [ -f data/last_update.json ]; then
            echo "- 更新記錄:" >> $GITHUB_STEP_SUMMARY
            cat data/last_update.json >> $GITHUB_STEP_SUMMARY
          fi
