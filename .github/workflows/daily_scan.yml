name: Daily Scan

on:
  schedule:
    - cron: "0 9 * * 1-5"  # UTC 09:00 = 台灣 17:00
  workflow_dispatch:

jobs:
  daily-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas yfinance requests

      - name: Run daily_scan.py
        run: python daily_scan.py --no-push

      - name: Push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          git add data/triggered_alerts.json data/margin_summary.json || true
          git diff --cached --quiet || git commit -m "auto: daily scan $(date +'%Y-%m-%d')"
          git push
